<!DOCTYPE html>
<html lang="en">
<head>
    <title>Find Pc</title>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="{{url_for('static', filename='pc_load.css')}}">
</head>
<body>
    <nav class="nav-bar">
        <div class="logo">Verify Pc</div>
        <button class="nav-toggle">
            <span class="bar"></span>
            <span class="bar"></span>
            <span class="bar"></span>
        </button>
        <ul class="nav-items">
            <li><a href="/">Home</a></li>
            <li><a href="/find">Search</a></li>
            <li><a href="/update">Update</a></li>
        </ul>
    </nav>
    <form action="/find" method="POST">
        <div class="search-box">
            <h1 class="search-title">Search your PC</h1>
            <div class="search-input">
                <input type="text" name="id_number" value="{{id_number}}" placeholder="Enter your id number">
                <input type="text" name="serial_number" value="{{serial_number}}" placeholder="Enter your serial number">
            </div>
            {%if error%}
            <h3 class="error">{{error}}</h3>
            {% endif %}
            <button type="submit" class="search-btn">Search PC</button>

            <h3 class="comment">{{status_message}}</h3>
                {%if info%}
                <p class="info">HOLDER NAME: {{holder_name}}</p>
                <p class="info">ID NUMBER: {{id_number}}</p>
                <p class="info">SERIAL NUMBER: {{serial_number}}</p>
                <p class="info">PC BRAND: {{pc_brand}}</p>
                {% endif %}
        </div>
        
    </form>
</body>
</html>
